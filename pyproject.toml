[project]
name = "plan-security-check"
version = "0.1.0"
description = "Local agent skill that security-reviews implementation plans before development"
license = { text = "Apache-2.0" }
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
readme = "README.md"
classifiers = [
    "License :: OSI Approved :: Apache Software License",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["skill/plan-security-check/scripts"]
